name: Database

# The only way the live schema changes: migrations pushed here, then checked and snapshotted.
# The daily run also keeps the free project from pausing, if a CLI connection counts as activity (unconfirmed).
on:
  push:
    branches: [master]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        type: choice
        default: push
        options:
          - push
          - mark-baseline-applied

# One run at a time; never cancel one half-way.
concurrency:
  group: db-push
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # snapshot commit
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Look for the secrets
        id: gate
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ] && [ -n "$SUPABASE_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Supabase secrets are not set; migrations not pushed, schema not checked."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: `prepare` would enable the pre-push hook (check + full browser tests), which then runs on the snapshot push.
      - run: npm ci --ignore-scripts
        if: steps.gate.outputs.ready == 'true'
      # Policies tested offline before they reach the project.
      - run: node --test test/unit/rls.test.js
        if: steps.gate.outputs.ready == 'true'
      - uses: supabase/setup-cli@v3
        if: steps.gate.outputs.ready == 'true'
        with:
          version: 2.122.0
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        if: steps.gate.outputs.ready == 'true'
      - run: supabase db push
        if: steps.gate.outputs.ready == 'true' && github.event.inputs.task != 'mark-baseline-applied'
      # One-off: the live schema predates the migration log, so record the baseline as applied without running it.
      - run: supabase migration repair --status applied 20261031000000
        if: steps.gate.outputs.ready == 'true' && github.event.inputs.task == 'mark-baseline-applied'
      - run: supabase migration list
        if: steps.gate.outputs.ready == 'true' && github.event.inputs.task == 'mark-baseline-applied'
      # `db diff` builds a shadow database from the migrations in Docker (present on GitHub's runners).
      # Diff goes to stdout and the exit code is 0 either way, so the check reads the output.
      - name: Drift check
        if: steps.gate.outputs.ready == 'true'
        run: |
          supabase db diff --linked --schema public > drift.sql
          if grep -v '^No schema changes found$' drift.sql | grep -q .; then
            cat drift.sql
            echo "::error::The live schema differs from the migrations."
            exit 1
          fi
      # `db dump` runs pg_dump in a Docker container as well.
      # Newer pg_dump writes a random \restrict token per run; dropped so an unchanged schema stays unchanged.
      - name: Schema snapshot
        if: steps.gate.outputs.ready == 'true'
        run: |
          supabase db dump --linked -f dump.sql
          {
            echo "-- Generated by .github/workflows/db.yml from the live schema. Do not edit."
            sed -E '/^\\(un)?restrict /d' dump.sql
          } > supabase/schema.snapshot.sql
          rm dump.sql drift.sql
          if [ -z "$(git status --porcelain supabase/schema.snapshot.sql)" ]; then
            echo "Snapshot unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/schema.snapshot.sql
          git commit -m "Schema snapshot [skip ci]"
          git pull --rebase
          git push
